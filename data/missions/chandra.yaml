description: "The Chandra X-ray Observatory (formerly the Advanced X-ray Astrophysics Facility, or AXAF) was built around
  a high-resolution grazing incidence X-ray telescope which will make astrophysical observations in the 0.09 to 10.0 keV energy
  range. The principal science objectives of the mission were to determine the nature of celestial objects from normal stars
  to quasars, to understand the nature of physical processes which take place in and between astronomical objects, and to
  generally study the history and evolution of the universe. Observations will be made of X-rays from high energy regions
  such as supernova remnants, X-ray pulsars, black holes, neutron stars, and hot galactic clusters. \n\nThe spacecraft has
  a cone-shaped body with an octagonal structure surrounding the wide end. Two solar panel wings extend from opposite sides
  of the structure. The main opening is at the wide end covered by a sunshade door with a contamination cover. An aspect camera
  and stray light shade are mounted near the opening and two low-gain antennas and two fine Sun sensors are affixed to the
  outside structure. Thermal control is maintained by a radiator, insulators, heaters, and thermostats. Power generated by
  the solar panels is stored in three banks of batteries. \n\nThe X-ray telescope consists of four nested paraboloid-hyperboloid
  X-ray mirror pairs, arranged in concentric cylinders within the cone. The four instruments are located near the focus at
  the narrow end of the cone: the High Resolution Camera (HRC), the CCD Imaging Spectrometer (ACIS), High Energy Transmission
  Grating Spectrometer (HETGS), and the Low Energy Transmission Grating (LETG)."

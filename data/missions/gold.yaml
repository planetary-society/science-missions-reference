description: "SES-14 is a hybrid satellite with C- and Ku-band wide beam coverage, as well as Ku- and Ka-band High Throughput
  Satellite (HTS) coverage across the Americas and the North Atlantic region. The satellite will fully rely on electric propulsion
  and will be equipped with an electric plasma propulsion system for orbit raising and in-orbit manoeuvres. The electric propulsion
  system delivers significant reduction in the weight of the satellite, enabling larger payloads to be carried. The new spacecraft
  will also feature a Digital Transparent Processor (DTP), increasing the payload flexibility to provide customized bandwidth
  solutions to SES's customers. \n\nThe SES-14 payload includes the Global-scale Observations of the Limb and Disk (GOLD)
  instrument for earth science and heliophysics studies."

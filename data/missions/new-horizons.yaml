description: "New Horizons is a mission designed to fly by Pluto and its moon Charon and transmit images and data back to
  Earth. It will then continue on into the Kuiper Belt where it will fly by a one or more Kuiper Belt Objects and return further
  data. The primary objectives are to characterize the global geology and morphology and map the surface composition of Pluto
  and Charon and characterize the neutral atmosphere of Pluto and its escape rate. Other objectives include studying the time
  variability of Pluto's surface and atmosphere, imaging Pluto and Charon in stereo, mapping the terminators and composition
  of selected areas of Pluto and Charon at high-resolution, characterizing Pluto's upper atmosphere, ionosphere, energetic
  particle environment, and solar wind interaction, searching for an atmosphere around Charon and characterizing its energetic
  particle environment, refining bulk parameters, orbits, and bolometric Bond albedos of Pluto and Charon, searching for additional
  satellites and rings, and characterizing one or more Kuiper Belt Objects. \n\n#### Mission Profile\n\nNew Horizons launched
  at 19:00 UT (2:00 p.m. EST) on 19 January 2006 on an Atlas V 551 booster with a Star 48B third stage directly into an interplanetary
  trajectory. It passed within 101,867 km of main belt asteroid JF56 on 13 June 2006. It used the encounter as a test of its
  instruments and tracking and navigation sensors, and returned images of the 2.5 km diameter asteroid, which only shows as
  a faint dot at that distance. It reached Jupiter for a gravity assist on 28 February 2007. The flyby came within about 32
  Jovian radii of Jupiter at 21 km/s and was the center of a 4 month intensive Jupiter system observation campaign. The flyby
  put the spacecraft on a trajectory towards Pluto, about 2.5 degrees out of the plane of the solar system. On 8 June 2008
  New Horizons crossed the orbit of Saturn. During cruise to Pluto New Horizons may be targeted to fly by a Centaur object
  (an escaped Kuiper Belt Body) if a suitable target can be identified. \n\nFlyby of Pluto took place on 14 July 2015 with
  closest approach at 11:48:45 UT (7:48:45 EDT). The encounter period began 6 months prior to closest approach. Long range
  imaging included 40 km mapping of Pluto and Charon 3.2 days out. This is half the rotation period of Pluto-Charon and allowed
  imaging of the side of both bodies which were facing away from the spacecraft at closest approach. New Horizons flew within
  12500 km of Pluto at a relative velocity of 11 km/s at closest approach and came as close as 27,000 km to Charon. During
  the flyby the instruments were able to obtain images with resolution as high as about 25 m/pixel, 4-color global dayside
  maps at 0.7 km/pixel, hyper-spectral near infrared maps at 7 km/pixel globally and 0.6 km/pixel for selected areas, characterization
  of the atmosphere, and radio science results. Because of the limited power available, the instruments were duty cycled during
  encounter. The flyby took place at a distance of 33 AU from Earth with a round-trip light time of 9 hours. Encounter data
  will be transmitted to Earth at 600 bps over a 9-month period. After passing by Pluto, New Horizons continued out towards
  the Kuiper Belt. A 16-minute hydrazine thruster maneuver on 22 October 2015 put the spacecraft on course towards Kuiper
  Belt object Arrokoth (2014 MU69). Three more maneuvers over the next two weeks put it on course for a flyby of Arrokoth,
  which it performed on 1 January 2019. Closest approach distance was 3500 km, at 05:33 UT. Similar measurements (including
  imaging) to those made at Pluto were conducted. \n\n#### Spacecraft and Subsystems\n\nThe spacecraft has the shape of a
  thick triangle (0.68 x 2.11 x 2.74 m) with a cylindrical radiothermal generator (RTG) protruding from one vertex in the
  plane of the triangle and a 2.1 m high-gain radio dish antenna affixed to one flank side. An aluminum central cylinder supports
  surrounding honeycomb panels. The central cylinder acts as the payload adapter fitting and houses the propellant tank. The
  465 kg launch mass includes 80 kg of propellant. The entire structure is covered in thermal multi-layer insulating blankets
  and thermal control is further achieved by electrical dissipation and RTG waste heat, thermal louvers, and external shunt
  plates. Communication from Pluto will be via X-band at a rate of 600 bps through the high gain antenna to a 70-m DSN dish.
  There are also two low gain antennas for communications within 5 AU and a medium gain antenna with uplink capability to
  50 AU. The RTG will provide approximately 228 W at encounter in 2015. Hydrazine monopropellant is used for propulsion via
  four 4.4 N thrusters and twelve 0.8 N thrusters, a delta-V capability of 290 m/s will be available after launch. The hydrazine
  is stored in a titanium tank separated from the gaseous nitrogen pressurant by a girth-mounted diaphragm. The spacecraft
  has both 3-axis stabilized and spin-stabilized modes. Star cameras are mounted on the side of the spacecraft for navigation.\
  \ \n\nThe 31 kg science payload package requires 21 W of power and consists of seven scientific instruments. The Long Range
  Reconnaisance Imager (LORRI) consists of a visible light, high-resolution CCD Imager. The Ralph instrument is composed of
  two parts, a visible CCD imager (MVIC) and a near-infrared imaging spectrometer (LEISA). The Alice instrument is an ultraviolet
  imaging spectrometer. The plasma and high energy particle spectrometer suite (PAM) consists of SWAP, a toroidal electrostatic
  analyzer and retarding potential analyzer, and PEPSSI, a time-of-flight ion and electron sensor. The Radio Science Experiment
  (REX) will use an ultrastable oscillator to conduct radio science investigations. A student-built dust counter (SDC) will
  make dust measurements in the outer solar system. Total mission cost is planned to be under $550 million."

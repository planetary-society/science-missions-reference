description: "VERITAS (Venus Emissivity, Radio science, Insar, Topography, And Spectroscopy) is a Discovery class mission
  planned to orbit Venus and return data for four Venus rotations (roughly 2 1/2 Earth years). The scientific objectives are
  to study past and present water, current or recent volcanic activity, and the geologic evolution of Venus. \n\nVERITAS is
  scheduled to launch and reach Venus no earlier than 2031, with data acquisition beginning about a year after launch and
  final circular science orbit achieved, using aerobraking, a year after that. The final orbit would have an altitude of less
  than 250 km. \n\nThe VERITAS science payload comprises two instruments, the Venus Interferometric Synthetic Aperture Radar
  (VISAR) and the Venus Emissivity Mapper (VEM). It also has a gravity science experiment using a Ka-band uplink and downlink.
  Science return is expected to include a digital elevation model with 5 meter height resolution, synthetic aperture radar
  imaging at 30 meters horizontal resolution globally and 15 meter resolution over about 20% of the surface, and surface deformation
  measurements at 2 mm precision. It would also return surface coverage in multiple near infrared bands for water vapor measurements
  and global gravity field with 160 km resolution and 3 mgal accuracy."
